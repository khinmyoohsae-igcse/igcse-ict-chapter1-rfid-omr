                    { text: "Manual text entry keyboards", isCorrect: false, rationale: "OMR does not use manual typing." },
                    { text: "Soft-copy visual output display units", isCorrect: false, rationale: "OMR is an input device, not an output display." },
                    { text: "Sequential backing storage magnetic tape drives", isCorrect: false, rationale: "This is storage, not input." }
                ]
            },
            {
                question: "Which of the following best summarizes the overall comparison between RFID and OMR in IGCSE ICT?",
                options: [
                    { text: "RFID is a wireless radio frequency identification technology used for real-time tracking and contactless transactions, whereas OMR is an optical paper-scanning technology used to read pre-printed shaded marks", isCorrect: true, rationale: "RFID handles wireless radio tags and tracking, while OMR processes physical shaded paper forms optically." },
                    { text: "RFID and OMR are identical technologies used exclusively for printing exam question papers", isCorrect: false, rationale: "They are completely different input technologies." },
                    { text: "Both RFID and OMR require students to fill in bubble sheets with HB pencils", isCorrect: false, rationale: "Only OMR uses pencil bubble sheets." },
                    { text: "Neither technology is part of the IGCSE ICT syllabus", isCorrect: false, rationale: "Both 2.2.2 RFID and 2.2.3 OMR are core syllabus topics." }
                ]
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const questionCounter = document.getElementById("question-counter");
        const scoreDisplay = document.getElementById("score-display");
        const questionBox = document.getElementById("question-box");
        const optionsContainer = document.getElementById("options-container");
        const feedbackBox = document.getElementById("feedback-box");
        const nextBtn = document.getElementById("next-btn");
        const quizContainer = document.getElementById("quiz-container");
        const resultsContainer = document.getElementById("results-container");
        const finalScore = document.getElementById("final-score");

        function loadQuestion() {
            answered = false;
            feedbackBox.classList.add("hidden");
            nextBtn.classList.add("hidden");

            const q = questions[currentQuestionIndex];
            questionCounter.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
            scoreDisplay.textContent = `Score: ${score}`;
            questionBox.textContent = q.question;

            optionsContainer.innerHTML = "";
            q.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = opt.text;
                btn.onclick = () => selectOption(idx);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex) {
            if (answered) return;
            answered = true;

            const q = questions[currentQuestionIndex];
            const allOptionButtons = optionsContainer.children;

            q.options.forEach((opt, idx) => {
                allOptionButtons[idx].disabled = true;
                if (opt.isCorrect) {
                    allOptionButtons[idx].classList.add("correct");
                } else if (idx === selectedIndex) {
                    allOptionButtons[idx].classList.add("incorrect");
                }
            });

            const selectedOpt = q.options[selectedIndex];
            feedbackBox.classList.remove("hidden");
            if (selectedOpt.isCorrect) {
                score++;
                scoreDisplay.textContent = `Score: ${score}`;
                feedbackBox.className = "feedback-box correct-feedback";
                feedbackBox.innerHTML = `<strong>Correct!</strong> ${selectedOpt.rationale}`;
            } else {
                feedbackBox.className = "feedback-box incorrect-feedback";
                feedbackBox.innerHTML = `<strong>Incorrect.</strong> ${selectedOpt.rationale}`;
            }

            if (currentQuestionIndex < questions.length - 1) {
                nextBtn.textContent = "Next Question";
            } else {
                nextBtn.textContent = "View Results";
            }
            nextBtn.classList.remove("hidden");
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                quizContainer.classList.add("hidden");
                resultsContainer.classList.remove("hidden");
                finalScore.textContent = `You scored ${score} out of ${questions.length}`;
            }
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            resultsContainer.classList.add("hidden");
            quizContainer.classList.remove("hidden");
            loadQuestion();
        }

        // Initialize quiz on load
        loadQuestion();
    </script>
</body>
